* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {

}
code, .mono { font-family: Consolas, "Courier New", Courier, monospace; }
button, select { font: inherit; color: inherit; }

/* ---- header ---- */
header {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;

}

.group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.group > span.lbl { color: var(--cp-text-muted); font-size: 12px; margin-right: 2px; }
.seg {
  border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 0.625rem;
  padding: 4px 10px; cursor: pointer; font-size: 13px;
}
.seg:hover { border-color: var(--cp-border-strong); }
.seg.on { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--cp-border);

}
.chip.off { opacity: 0.45; }
.sw { width: 18px; height: 0; border-top: 3px solid currentColor; display: inline-block; }
select.seg { padding: 4px 8px; }

main { flex: 1; display: flex; min-height: 0; }
#viewport { flex: 1; overflow: auto; position: relative; }
#wrap { position: relative; margin: 12px; }
#stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
aside {

}

aside a { color: var(--cp-link); }
.sub { color: var(--cp-text-muted); }
.conn { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 6px;

.steps { display: flex; gap: 6px; align-items: center; margin: 10px 0; }
.stepdots { display: flex; gap: 4px; }
.stepdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--cp-border); display: block; }
.stepdots i.on { background: var(--cp-accent); }

/* ---- canvas ---- */
.box {

  background: color-mix(in srgb, var(--cp-surface) 40%, transparent);
}
.box > .bl {
  position: absolute; left: 12px; top: -12px; padding: 1px 10px; border-radius: 999px;

.box > .bl img { width: 16px; height: 16px; }

.node .tx { min-width: 0; }
.node .t { font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.node .s { font-size: 11.5px; color: var(--cp-text-muted); line-height: 1.25; margin-top: 2px; }
.node .rg {

#stage.focus .node:not(.hl), #stage.focus .box { opacity: 0.35; }

#stage.focus svg#edges path.e.hl { stroke-width: 3; opacity: 1; }
.hidden { display: none !important; }

.legend {
  position: absolute; display: flex; gap: 28px; padding: 14px 18px; background: var(--cp-surface);

body.nochrome header, body.nochrome aside { display: none; }

ervice.", "learn": "https://learn.microsoft.com/en-us/microsoft-365/agents-sdk/agent-oauth-configuration"}, "x": 575, "y": 425, "w": 190, "h": 80, "region": null}, {"id": "bot", "box": "b-bot", "title": "Compass bot", "sub": "Agents SDK · trusted backend", "icon": "bot", "status": "verified", "w": 190, "detail": {"what": "Owns the conversation, authenticates the person, performs OBO, and calls Foundry with the person's tokens.", "identity": "A confidential client. Learn's requirement is exactly this: a trusted application backend that authenticates users and can perform OBO.", "access": "Scope its Foundry roles to what it must call, take the object ID only from a validated token, and give it no secret.", "notes": "This is a trust boundary: the bot can assert any person to the agents its role covers.", "learn": "https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/use-on-behalf-of-flow"}, "x": 575, "y": 525, "h": 85, "region": null}, {"id": "bot-obo", "box": "b-bot", "title": "MSAL OBO", "sub": "one token per audience", "icon": "azure/identity/api-proxy", "status": "verified", "detail": {"what": "The bot exchanges the person's token for a downstream token, per audience, as a confidential client.", "identity": "Entra issues every one of these. There is no second token service.", "notes": "Compass already does this today for its function tools. The pattern does not change — only who it is handed to.", "learn": "https://learn.microsoft.com/en-us/entra/identity-platform/v2-oauth2-on-behalf-of-flow"}, "x": 790, "y": 425, "w": 190, "h": 80, "region": null}, {"id": "maf", "box": "b-bot", "title": "Agent Framework workflow", "sub": "fan-out · fan-in · fail closed", "icon": "azure/general/workflow", "status": "verified", "detail": {"what": "A Microsoft Agent Framework workflow: scope the turn (the route, then the question) → the executors in scope in parallel → a fan-in barrier → compose one reply.", "identity": "Receives the person and the three tokens once; never e erson is already in Teams. Their identity has to arrive at our code as something we can spend, without a second prompt.", "n": ["p-daniel", "teams", "botsvc", "bot"], "e": ["u1", "u2", "u3"]}, {"t": "R2 · Act on their behalf, with no secret to leak", "x": "The bot exchanges the person's token itself. Its credential is federated: the app registration trusts the managed identity, so nothing is stored or rotated.", "n": ["bot", "bot-obo", "e-botapp", "e-botmi"], "e": ["u4", "g6", "s1"]}, {"t": "R3 · One token per system, never reused across audiences", "x": "Graph, Search and our own API each get their own token, issued by Entra with the person as subject. A token for one audience is useless to the others.", "n": ["e-person-tok", "retr", "search", "mcp"], "e": ["u5"]}, {"t": "R4 · Carry the person through the agent platform without becoming the person", "x": "Foundry takes the bot's own identity for authorization and the person's object id as a claim. The bot needs a role nobody gets by default, and Foundry still never exchanges the tokens.", "n": ["maf", "svc", "e-roles", "e-botmi"], "e": ["u7", "g1", "g2"]}, {"t": "R5 · Let SharePoint decide what they may see — two routes", "x": "Route A: a hosted agent calls the Copilot Retrieval API. Route B: a prompt agent calls a Foundry IQ knowledge base. Different plumbing, same rule: SharePoint's permissions decide.", "n": ["agentA", "retr", "agentB", "search", "spo"], "e": ["u8", "u9", "u10", "u14", "u15", "u16"]}, {"t": "R6 · Reach our own data, over MCP, with the same person", "x": "A third agent calls our MCP server with the Zava API token. The server validates audience and issuer, then resolves the person to a member.", "n": ["agentC", "mcp", "core"], "e": ["u11", "u12", "u13"]}, {"t": "R7 · One reply from three answers, and fail closed", "x": "An Agent Framework workflow fans out to the agents the question needs and waits at a fan-in barrier. If any branch fails, the whole turn fails — no partial answer, no silent downgrade.", "n": ["maf", "svc", "agentA", "agentB", "agentC"], "e": ["u6", "u7"]}]}, {"id": "sc-happy", "title": "One question, two people", "steps": [{"t": "Daniel asks Compass in Teams", "x": "He is already signed in. Nothing prompts him, and nothing will.", "n": ["p-daniel", "teams"], "e": ["u1"]}, {"t": "Teams SSO hands the bot the person", "x": "Bot Service brokers a token for the bot's own API. It brokers; it does not issue the downstream ones.", "n": ["botsvc", "bot"], "e": ["u2", "u3"]}, {"t": "The bot does the OBO once per system", "x": "Graph, Search and the Zava API: three exchanges, all by Entra, all with Daniel as subject.", "n": ["bot-obo", "e-person-tok"], "e": ["u4", "u5"]}, {"t": "The workflow fans out to the agents in scope", "x": "Up to three calls in parallel, each carrying Daniel's object id and his tokens. Foundry forwards them and exchanges nothing.", "n": ["maf", "svc", "agentA", "agentB", "agentC"], "e": ["u6", "u7", "u8", "u11", "u14"]}, {"t": "SharePoint decides, by two routes", "x": "The Retrieval API and the knowledge base both query SharePoint as Daniel. He gets Lending Policy and the FAQ; Portfolio and Collections never comes back.", "n": ["agentA", "retr", "agentB", "search", "spo"], "e": ["u9", "u10", "u15", "u16"]}, {"t": "Member data arrives scoped to him", "x": "The MCP server validates the token and returns Daniel's member record, never Maya's.", "n": ["agentC", "mcp", "core"], "e": ["u12", "u13"]}, {"t": "Maya asks the same question", "x": "Same code, same agents, different tokens. She gets Portfolio and Collections and the FAQ, and not the Lending Policy. The bot never needed to know why.", "n": ["p-maya", "teams", "spo"], "e": ["u1b"]}]}, {"id": "sc-routes", "title": "Two routes to the same SharePoint", "steps": [{"t": "Route A · Copilot Retrieval API through a hosted agent", "x": "The agent reads the Graph token from x-client-graph-access-token and calls the API as the person. Fast, and semantic over Office and PDF content.", "n": ["agentA", "retr", "spo"], "e": ["u8", "u9", "u10"]}, {"t": "Route B · Foundry IQ knowledge base through a prompt agent", "x": "The Search token rides as a structured input and becomes x-ms-query-source-authorization. The knowledge base queries SharePoint live as the person.", "n": ["agentB", "search", "spo"], "e": ["u14", "u15", "u16"]}, {"t": "Same permission model, different plumbing", "x": "Neither route ever sees an ACL, and neither copies content. SharePoint decides at query time, so a revoked permission takes effect immediately.", "n": ["spo"], "e": ["u10", "u16"]}, {"t": "Why A is the default, and when you would choose B", "x": "A is lower latency and GA. B is the right answer when the knowledge base should combine SharePoint with other sources, or when you want the model to plan its own sub-queries. An indexed source is for scale, at the cost of an ACL that is only as fresh as the last sync.", "n": ["agentA", "agentB", "indexed"], "e": ["x3"]}]}, {"id": "sc-ruled", "title": "The paths we ruled out", "steps": [{"t": "Publish to Teams from Foundry", "x": "Not established for a no-new-prompt requirement, and published agents support neither streaming nor citations — both of which Compass uses.", "n": ["publish"], "e": []}, {"t": "The Foundry SharePoint tool", "x": "Learn is explicit: it doesn't work when the agent is published to Microsoft Teams.", "n": ["sptool"], "e": ["x2"]}, {"t": "A toolbox oauth2 connection", "x": "Runs Foundry's own per-person authorization when no grant exists. No documented way to hand it the token Compass already holds.", "n": ["toolbox"], "e": ["x1"]}, {"t": "An indexed SharePoint source", "x": "Permissions are as of the last sync. Fine at scale, wrong when the answer must always reflect who may see what right now.", "n": ["indexed"], "e": ["x3"]}]}, {"id": "sc-gov", "title": "What has to be true before it works", "steps": [{"t": "A federated credential instead of a secret", "x": "The bot app registration trusts the bot's managed identity. Nothing to store, rotate or leak.", "n": ["e-botmi", "e-botapp"], "e": ["g6"]}, {"t": "An admin consents once, for everyone", "x": "Three grants on the bot app, so no employee ever sees a consent prompt.", "n": ["p-admin", "e-consent"], "e": ["g3", "g4"]}, {"t": "The bot needs a role nobody gets by default", "x": "The Foundry role to call agents plus a custom role holding the impersonation data action. Without it: 403 on every call.", "n": ["e-botmi", "e-roles", "svc"], "e": ["g1", "g2"]}, {"t": "Conditional Access can still interrupt", "x": "A claims challenge has to travel back to the bot and be satisfied in Teams. An agent cannot resolve it on its own.", "n": ["e-ca", "bot-obo"], "e": ["g5"]}, {"t": "Traces without tokens", "x": "Redaction runs before export, so no JWT-shaped string reaches Application Insights.", "n": ["bot", "mcp", "appins"], "e": ["s3", "s4"]}]}]}}};

const params = new URLSearchParams(location.search);
const LAYER_KEYS = Object.keys(DATA.layers);
const STATUS_KEYS = Object.keys(DATA.statuses);
const state = {
  view: params.get("view") || "components",
  layers: new Set((params.get("layers") || LAYER_KEYS.join(",")).split(",").filter(k => LAYER_KEYS.includes(k))),
  statuses: new Set(STATUS_KEYS),
  labels: params.get("labels") || "hops",
  scenario: params.get("scenario") || "",
  step: Number(params.get("step") || 0),
  selected: null,
  scale: 1,
  fitted: true,
};
if (params.get("chrome") === "0") document.body.classList.add("nochrome");

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LEGEND_H = 180;

function view() { return DATA.views[state.view]; }
function nodeById(id) { return view().nodes.find(n => n.id === id); }

/* ---------------- header controls ---------------- */
function buildHeader() {
  const views = $("#views");
  views.innerHTML = "";
  for (const [key, v] of Object.entries(DATA.views)) {
    const b = el("button", "seg" + (key === state.view ? " on" : ""), esc(v.title.split(" · ")[0]));
    b.title = v.title;
    b.onclick = () => { state.view = key; state.scenario = ""; state.selected = null; state.fitted = true; render(); };
    views.appendChild(b);
  }
  const layers = $("#layers");
  layers.querySelectorAll(".chip").forEach(c => c.remove());
  for (const [key, [label, hint]] of Object.entries(DATA.layers)) {
    const c = el("span", "chip L-" + key + (state.layers.has(key) ? "" : " off"), `<i class="sw"></i><span style="color:var(--cp-text)">${esc(label)}</span>`);
    c.title = hint;
    c.onclick = () => { state.layers.has(key) ? state.layers.delete(key) : state.layers.add(key); render(); };
    layers.appendChild(c);
  }
  const sts = $("#statuses");
  sts.querySelectorAll(".chip").forEach(c => c.remove());
  for (const [key, label] of Object.entries(DATA.statuses)) {
    const c = el("span", "chip" + (state.statuses.has(key) ? "" : " off"), `<i class="st" style="width:10px;height:10px;border-radius:3px;display:inline-block;background:${statusColor(key)}"></i>${esc(label.split(";")[0])}`);
    c.onclick = () => { state.statuses.has(key) ? state.statuses.delete(key) : state.statuses.add(key); render(); };
    sts.appendChild(c);
  }
  const sc = $("#scenario");
  sc.innerHTML = '<option value="">Choose a scenario…</option>';
  for (const s of (view().scenarios || [])) sc.appendChild(new Option(s.title, s.id, false, s.id === state.scenario));
  sc.disabled = !(view().scenarios || []).length;
  $("#labels").value = state.labels;
}
function statusColor(key) {
  return {verified: "var(--cp-success)", built: "var(--cp-link)", gated: "var(--cp-warning)", off: "var(--cp-border-strong)", blocked: "var(--cp-danger)"}[key];
}

/* ---------------- geometry ---------------- */
function side(a, b) {
  const ax = a.x + a.w / 2, ay = a.y + a.h / 2, bx = b.x + b.w / 2, by = b.y + b.h / 2;
  const dx = bx - ax, dy = by - ay;
  if (Math.abs(dx) * (a.h + b.h) > Math.abs(dy) * (a.w + b.w)) return dx > 0 ? ["r", "l"] : ["l", "r"];
  return dy > 0 ? ["b", "t"] : ["t", "b"];
}
const NORMAL = {r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1]};
function anchor(n, s, frac) {
  if (s === "r") return [n.x + n.w, n.y + n.h * frac];
  if (s === "l") return [n.x, n.y + n.h * frac];
  if (s === "t") return [n.x + n.w * frac, n.y];
  return [n.x + n.w * frac, n.y + n.h];
}
function layoutEdges(edges) {
  const slots = {};
  const geo = edges.map(e => {
    const a = nodeById(e.from), b = nodeById(e.to);
    const [sa, sb] = e.route === "over" ? ["t", "t"] : side(a, b);
    const g = {e, a, b, sa, sb};
    for (const [n, s, other] of [[a, sa, b], [b, sb, a]]) {
      const k = n.id + ":" + s;
      (slots[k] = slots[k] || []).push({g, other, end: n === a ? "a" : "b"});
    }
    return g;
  });
  for (const list of Object.values(slots)) {
    const horizontalSide = /[tb]$/.test(list[0].end === "a" ? list[0].g.sa : list[0].g.sb);
    list.sort((p, q) => horizontalSide ? (p.other.x + p.other.w / 2) - (q.other.x + q.other.w / 2)
                                       : (p.other.y + p.other.h / 2) - (q.other.y + q.other.h / 2));
    list.forEach((item, i) => { item.g[item.end + "f"] = (i + 1) / (list.length + 1); });
  }
  for (const g of geo) {
    const p0 = anchor(g.a, g.sa, g.af), p3 = anchor(g.b, g.sb, g.bf);
    const d = Math.hypot(p3[0] - p0[0], p3[1] - p0[1]);
    const k = g.e.route === "over" ? Math.min(g.a.y, g.b.y) - 8 : Math.max(36, Math.min(220, d * 0.4));
    const n0 = NORMAL[g.sa], n3 = NORMAL[g.sb];
    const c1 = [p0[0] + n0[0] * k, p0[1] + n0[1] * k], c2 = [p3[0] + n3[0] * k, p3[1] + n3[1] * k];
    g.d = `M${p0[0]},${p0[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p3[0]},${p3[1]}`;
    g.mid = [(p0[0] + 3 * c1[0] + 3 * c2[0] + p3[0]) / 8, (p0[1] + 3 * c1[1] + 3 * c2[1] + p3[1]) / 8];
  }
  return geo;
}

/* ---------------- render ---------------- */
function render() {
  buildHeader();
  const v = view();
  const stage = $("#stage");
  stage.innerHTML = "";
  const W = v.w, H = v.h + LEGEND_H;
  stage.style.width = W + "px"; stage.style.height = H + "px";
  stage.className = state.labels === "all" || (state.view === "context" && state.labels === "hops") ? "labels-all" : "";

  for (const b of v.boxes) {
    const d = el("div", "box " + b.tone);
    Object.assign(d.style, {left: b.x + "px", top: b.y + "px", width: b.w + "px", height: b.h + "px"});
    const icon = b.icon && ICONS[b.icon] ? `<img src="${ICONS[b.icon]}" alt="">` : "";
    d.appendChild(el("div", "bl", icon + esc(b.label)));
    stage.appendChild(d);
  }

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.id = "edges"; svg.setAttribute("width", W); svg.setAttribute("height", H);
  const defs = document.createElementNS(svgNS, "defs");
  for (const key of LAYER_KEYS.concat(["blocked"])) {
    const m = document.createElementNS(svgNS, "marker");
    m.setAttribute("id", "arw-" + key); m.setAttribute("viewBox", "0 0 10 10"); m.setAttribute("refX", "9");
    m.setAttribute("refY", "5"); m.setAttribute("markerWidth", "7"); m.setAttribute("markerHeight", "7");
    m.setAttribute("orient", "auto-start-reverse"); m.setAttribute("class", key === "blocked" ? "" : "L-" + key);
    if (key === "blocked") m.style.color = "var(--cp-danger)";
    const p = document.createElementNS(svgNS, "path"); p.setAttribute("d", "M0,0 L10,5 L0,10 z");
    m.appendChild(p); defs.appendChild(m);
  }
  svg.appendChild(defs);
  stage.appendChild(svg);

  const visible = v.edges.filter(e => state.layers.has(e.layer) && state.statuses.has(e.status));
  const geo = layoutEdges(visible);
  for (const g of geo) {
    const e = g.e;
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", g.d);
    path.setAttribute("class", `e L-${e.layer} S-${e.status}`);
    path.setAttribute("marker-end", `url(#arw-${e.status === "blocked" ? "blocked" : e.layer})`);
    path.dataset.id = e.id;
    const hit = document.createElementNS(svgNS, "path");
    hit.setAttribute("d", g.d); hit.setAttribute("class", "hit"); hit.dataset.id = e.id;
    hit.addEventListener("click", ev => { ev.stopPropagation(); selectEdge(e.id); });
    hit.addEventListener("mouseenter", () => hover({edge: e.id}));
    hit.addEventListener("mouseleave", () => hover(null));
    svg.appendChild(path); svg.appendChild(hit);
    if (e.hop && state.labels !== "none") {
      const h = el("div", "hop L-" + e.layer, `<b>${esc(e.hop)}</b>`);
      Object.assign(h.style, {left: g.mid[0] + "px", top: g.mid[1] + "px"});
      if (e.status === "off") h.style.opacity = 0.55;
      h.dataset.id = e.id; h.title = e.label;
      h.onclick = ev => { ev.stopPropagation(); selectEdge(e.id); };
      stage.appendChild(h);
    }
    const lab = el("div", "elab L-" + e.layer, `<span>${esc(e.label)}</span>`);
    Object.assign(lab.style, {left: g.mid[0] + "px", top: (g.mid[1] + (e.hop ? 18 : 0)) + "px"});
    lab.dataset.id = e.id;
    lab.onclick = ev => { ev.stopPropagation(); selectEdge(e.id); };
    stage.appendChild(lab);
  }

  for (const n of v.nodes) {
    const d = el("div", `node st-${n.status}` + (n.w >= 260 ? " big" : ""));
    Object.assign(d.style, {left: n.x + "px", top: n.y + "px", width: n.w + "px", height: n.h + "px"});
    const src = ICONS[n.icon] || "";
    d.innerHTML = (src ? `<img class="ic${n.icon.startsWith("avatar") ? " avatar" : ""}" src="${src}" alt="">` : "") +
      `<div class="tx"><div class="t">${esc(n.title)}</div><div class="s">${esc(n.sub)}</div></div>` +
      (n.region ? `<span class="rg">${esc(n.region)}</span>` : "");
    d.dataset.id = n.id;
    d.onclick = ev => { ev.stopPropagation(); selectNode(n.id); };
    d.onmouseenter = () => hover({node: n.id});
    d.onmouseleave = () => hover(null);
    stage.appendChild(d);
  }

  stage.appendChild(legend(v));
  stage.onclick = () => { state.selected = null; if (!state.scenario) showOverview(); applyFocus(); };
  if (state.fitted) fit(); else applyScale();
  if (state.scenario) showStep(); else if (state.selected) reselect(); else showOverview();
  applyFocus();
}

function legend(v) {
  const g = el("div", "legend");
  Object.assign(g.style, {left: "20px", top: (v.h + 12) + "px"});
  let layers = "<div><h4>Connections carry an identity</h4>";
  for (const [k, [label, hint]] of Object.entries(DATA.layers))
    layers += `<div class="row L-${k}"><i class="ln"></i><span style="color:var(--cp-text)"><b>${esc(label)}</b> <span class="sub">· ${esc(hint)}</span></span></div>`;
  layers += "</div>";
  let sts = `<div><h4>${esc(DATA.statusHeading)}</h4>`;
  for (const [k, label] of Object.entries(DATA.statuses))
    sts += `<div class="row"><i class="st" style="background:${statusColor(k)}"></i>${esc(label)}</div>`;
  sts += `<div class="row"><i class="ln" style="color:var(--cp-text-muted)"></i>solid · <i class="ln dash" style="color:var(--cp-text-muted)"></i>open question · <i class="ln dot" style="color:var(--cp-text-muted)"></i>not deployed</div></div>`;
  const numbered = "<div><h4>Numbers</h4><div class='row'><span class='hop L-user' style='position:static;transform:none;display:inline-flex'><b>4</b></span> " + esc(DATA.hopNote) + "</div>" +
    "<div class='row'>Region pill: " + esc(DATA.regionNote) + "</div>" +
    "<div class='row'>Click any box or line for what it does,<br>its identity, its access and how it is managed</div></div>";
  const credit = `<div class="credit"><h4>As of ${esc(DATA.asOf)}</h4>${esc(DATA.credit)}</div>`;
  g.innerHTML = layers + sts + numbered + credit;
  return g;
}

/* ---------------- focus and selection ---------------- */
let hovered = null;
function hover(h) { hovered = h; applyFocus(); }
function focusSet() {
  const v = view();
  if (state.scenario) {
    const st = scenario().steps[state.step];
    return {nodes: new Set(st.n), edges: new Set(st.e)};
  }
  const target = hovered || state.selected;
  if (!target) return null;
  if (target.edge) {
    const e = v.edges.find(x => x.id === target.edge);
    return {nodes: new Set([e.from, e.to]), edges: new Set([e.id])};
  }
  const edges = v.edges.filter(e => e.from === target.node || e.to === target.node);
  return {nodes: new Set([target.node, ...edges.map(e => e.from), ...edges.map(e => e.to)]), edges: new Set(edges.map(e => e.id))};
}
function applyFocus() {
  const stage = $("#stage");
  const f = focusSet();
  stage.classList.toggle("focus", !!f);
  stage.querySelectorAll(".node").forEach(n => {
    n.classList.toggle("hl", !!f && f.nodes.has(n.dataset.id));
    n.classList.toggle("sel", !!state.selected && state.selected.node === n.dataset.id);
  });
  stage.querySelectorAll("path.e, .hop, .elab").forEach(p => {
    const on = !!f && f.edges.has(p.dataset.id);
    p.classList.toggle("hl", on);
    if (p.classList.contains("elab")) p.classList.toggle("show", on && (state.scenario || hovered || state.selected));
  });
}
function selectNode(id) { state.scenario = ""; $("#scenario").value = ""; state.selected = {node: id}; showNode(id); applyFocus(); }
function selectEdge(id) { state.scenario = ""; $("#scenario").value = ""; state.selected = {edge: id}; showEdge(id); applyFocus(); }
function reselect() { state.selected.node ? showNode(state.selected.node) : showEdge(state.selected.edge); }

/* ---------------- panel ---------------- */
const panel = () => $("#panel");
function section(title, text) { return text ? `<h3>${esc(title)}</h3><p>${esc(text)}</p>` : ""; }
function statusChip(s) { return `<span class="chip" style="cursor:default"><i class="st" style="width:10px;height:10px;border-radius:3px;display:inline-block;background:${statusColor(s)}"></i>${esc(DATA.statuses[s])}</span>`; }
function showOverview() {
  const v = view();
  const scen = (v.scenarios || []).map(s => `<button class="conn" data-s="${s.id}">▸ ${esc(s.title)}</button>`).join("");
  panel().innerHTML = `<h2>${esc(v.title)}</h2>
    <p class="sub">${esc(DATA.subtitle)}</p>
    <h3>How to read it</h3>
    <p>C4 views, from the system in its context (level 1) to the containers (level 2) and the components, with every identity that connects them (level 3).</p>
    <p>Every line is a call, and its colour says <b>whose identity it travels as</b>: the signed-in person (blue), a service's managed identity (green), the agent's own Entra identity (rose), or a governance control (amber). Numbered circles are the user's hops, in order.</p>
    <p>Every box's left edge shows its status today: ${Object.values(DATA.statuses).map(s => { const x = s.split(';')[0]; return esc(x.charAt(0).toLowerCase() + x.slice(1)); }).join(', ')}.</p>
    <p>Click a box or a line for what it does, its identity, what it may reach, and how it is managed. Hover to trace its connections.</p>
    ${scen ? `<h3>Walk through</h3>${scen}` : ""}
    ${DATA.summary ? `<h3>The one idea</h3><p>${esc(DATA.summary)}</p>` : ""}`;
  panel().querySelectorAll("[data-s]").forEach(b => b.onclick = () => startScenario(b.dataset.s));
}
function connections(id) {
  const v = view();
  const list = v.edges.filter(e => e.from === id || e.to === id);
  if (!list.length) return "";
  return "<h3>Connections</h3>" + list.map(e => {
    const other = nodeById(e.from === id ? e.to : e.from);
    const dir = e.from === id ? "→" : "←";
    return `<button class="conn L-${e.layer}" data-e="${e.id}"><i class="sw"></i><span style="color:var(--cp-text)">${dir} ${esc(other.title)}${e.hop ? ` · hop ${esc(e.hop)}` : ""}<br><span class="sub">${esc(e.label)}</span></span></button>`;
  }).join("");
}
function showNode(id) {
  const n = nodeById(id), d = n.detail || {};
  panel().innerHTML = `<h2>${esc(n.title)}</h2><p class="sub">${esc(n.sub)}${n.region ? " · " + esc(n.region) : ""}</p>${statusChip(n.status)}
    ${section("What it does", d.what)}${section("Its identity", d.identity)}${section("What it may reach", d.access)}
    ${section("How it is managed", d.managed)}${section("Open questions", d.spikes)}${section("Note", d.notes)}
    ${d.learn ? `<h3>Microsoft Learn</h3><p><a href="${esc(d.learn)}" target="_blank" rel="noopener">${esc(d.learn.replace("https://learn.microsoft.com/en-us/", ""))}</a></p>` : ""}
    ${connections(id)}`;
  panel().querySelectorAll("[data-e]").forEach(b => { b.onclick = () => selectEdge(b.dataset.e); b.onmouseenter = () => hover({edge: b.dataset.e}); b.onmouseleave = () => hover(null); });
}
function showEdge(id) {
  const e = view().edges.find(x => x.id === id), d = e.detail || {};
  const a = nodeById(e.from), b = nodeById(e.to);
  const [layer, hint] = DATA.layers[e.layer];
  panel().innerHTML = `<h2>${esc(a.title)} → ${esc(b.title)}</h2><p class="sub L-${e.layer}"><i class="sw"></i> <span style="color:var(--cp-text-muted)">${esc(layer)} · ${esc(hint)}</span></p>${statusChip(e.status)}
    ${e.hop ? `<h3>Hop</h3><p>${esc(e.hop)} in the user's chain</p>` : ""}
    ${section("What travels", e.label)}${section("Mechanism", d.mechanism)}${section("Enforced by", d.enforced)}${section("Open question", d.spike)}
    <h3>Ends</h3><button class="conn" data-n="${a.id}">${esc(a.title)}</button><button class="conn" data-n="${b.id}">${esc(b.title)}</button>`;
  panel().querySelectorAll("[data-n]").forEach(x => x.onclick = () => selectNode(x.dataset.n));
}

/* ---------------- scenarios ---------------- */
function scenario() { return (view().scenarios || []).find(s => s.id === state.scenario); }
function startScenario(id) { state.scenario = id; state.step = 0; state.selected = null; $("#scenario").value = id; showStep(); applyFocus(); }
function showStep() {
  const s = scenario();
  if (!s) { state.scenario = ""; return showOverview(); }
  state.step = Math.max(0, Math.min(state.step, s.steps.length - 1));
  const st = s.steps[state.step];
  const edges = st.e.map(id => view().edges.find(x => x.id === id)).filter(Boolean);
  panel().innerHTML = `<h2>${esc(s.title)}</h2>
    <div class="steps"><button class="seg" id="prev">◀</button><div class="stepdots">${s.steps.map((_, i) => `<i class="${i === state.step ? "on" : ""}"></i>`).join("")}</div><button class="seg" id="next">▶</button><span class="sub">${state.step + 1} of ${s.steps.length}</span></div>
    <h3>${esc(st.t)}</h3><p>${esc(st.x)}</p>
    ${edges.length ? "<h3>In this step</h3>" + edges.map(e => `<button class="conn L-${e.layer}" data-e="${e.id}"><i class="sw"></i><span style="color:var(--cp-text)">${esc(nodeById(e.from).title)} → ${esc(nodeById(e.to).title)}${e.hop ? ` · hop ${esc(e.hop)}` : ""}<br><span class="sub">${esc(e.label)}</span></span></button>`).join("") : ""}
    <p style="margin-top:14px"><button class="seg" id="endsc">End walkthrough</button></p>`;
  $("#prev").onclick = () => { state.step--; showStep(); applyFocus(); };
  $("#next").onclick = () => { state.step++; showStep(); applyFocus(); };
  $("#endsc").onclick = () => { state.scenario = ""; $("#scenario").value = ""; showOverview(); applyFocus(); };
  panel().querySelectorAll("[data-e]").forEach(b => b.onclick = () => selectEdge(b.dataset.e));
  // ensure edges in the step are visible even if their layer is filtered out
  const hiddenLayers = edges.filter(e => !state.layers.has(e.layer));
  if (hiddenLayers.length) { hiddenLayers.forEach(e => state.layers.add(e.layer)); render(); }
}

/* ---------------- zoom ---------------- */
function fit() {
  const vp = $("#viewport"), v = view();
  const margin = document.body.classList.contains("nochrome") ? 0 : 24;
  state.scale = Math.min((vp.clientWidth - margin) / v.w, (vp.clientHeight - margin) / (v.h + LEGEND_H));
  state.fitted = true; applyScale();
}
function applyScale() {
  const v = view();
  $("#stage").style.transform = `scale(${state.scale})`;
  $("#wrap").style.width = v.w * state.scale + "px";
  $("#wrap").style.height = (v.h + LEGEND_H) * state.scale + "px";
}
$("#fit").onclick = fit;
$("#zoomin").onclick = () => { state.scale *= 1.2; state.fitted = false; applyScale(); };
$("#zoomout").onclick = () => { state.scale /= 1.2; state.fitted = false; applyScale(); };
$("#theme").onclick = () => { const r = document.documentElement; r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark"); };
$("#labels").onchange = e => { state.labels = e.target.value; render(); };
$("#scenario").onchange = e => e.target.value ? startScenario(e.target.value) : (state.scenario = "", showOverview(), applyFocus());
window.addEventListener("resize", () => { if (state.fitted) fit(); });
document.addEventListener("keydown", e => {
  if (state.scenario && e.key === "ArrowRight") { state.step++; showStep(); applyFocus(); }
  if (state.scenario && e.key === "ArrowLeft") { state.step--; showStep(); applyFocus(); }
  if (e.key === "Escape") { state.scenario = ""; state.selected = null; $("#scenario").value = ""; showOverview(); applyFocus(); }
});
render();
</script>
</body>
</html>
